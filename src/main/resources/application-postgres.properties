# Compose supplies the PostgreSQL URL and credentials through environment variables.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.h2.console.enabled=false

# Do not replay the H2 schema or demo data against the persistent database.
spring.sql.init.mode=never
# Suitable for local development; use versioned migrations for production.
spring.jpa.hibernate.ddl-auto=update
