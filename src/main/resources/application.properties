# Enabling H2 Console
spring.h2.console.enabled=true
#Turn Statistics on
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=debug
# Show all queries
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type=trace
spring.datasource.url=jdbc:h2:mem:testdb
spring.data.jpa.repositories.bootstrap-mode=default

# OpenAPI generation and Scalar UI (no Swagger UI)
springdoc.paths-to-match=/students,/students/**,/courses,/courses/**
springdoc.default-produces-media-type=application/json
scalar.path=/docs
scalar.url=./v3/api-docs
scalar.page-title=API Étudiants et cours
scalar.telemetry=false
scalar.with-default-fonts=false
