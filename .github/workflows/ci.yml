name: Java CI

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  verify:
    name: Tests et build du JAR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Installer Java 25 et restaurer le cache Maven
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Exécuter les tests et construire le JAR
        run: mvn -B -ntp verify

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Conserver le JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7
